services:
  postgres:
    image: postgres:16-alpine
    container_name: det-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-det_academy}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/db/03-content-seed.sql:/docker-entrypoint-initdb.d/03-content-seed.sql:ro
      - ./backend/db/04-vocabulary-seed.sql:/docker-entrypoint-initdb.d/04-vocabulary-seed.sql:ro
      - ./backend/db/05-productive-question-bank.sql:/docker-entrypoint-initdb.d/05-productive-question-bank.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-det_academy}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - det-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: det-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      ENV: production
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-det_academy}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      MEDIA_UPLOAD_DIR: "/data/media"
      MIGRATIONS_DIR: "/app/db/migrations"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-https://det-academy.ru,https://www.det-academy.ru}"
      REQUIRE_EMAIL_VERIFICATION: "${REQUIRE_EMAIL_VERIFICATION:-true}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-https://det-academy.ru}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-DET Academy <noreply@det-academy.ru>}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-${EMAIL_FROM:-DET Academy <noreply@det-academy.ru>}}"
      SMTP_IMPLICIT_TLS: "${SMTP_IMPLICIT_TLS:-false}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-gpt-4o-mini}"
      AI_MODEL_FAST: "${AI_MODEL_FAST:-}"
      AI_MODEL_EVAL: "${AI_MODEL_EVAL:-}"
      AI_FOLDER_ID: "${AI_FOLDER_ID:-}"
      AI_STT_MODEL: "${AI_STT_MODEL:-whisper-1}"
      AI_PRICE_INPUT_PER_1M: "${AI_PRICE_INPUT_PER_1M:-0}"
      AI_PRICE_OUTPUT_PER_1M: "${AI_PRICE_OUTPUT_PER_1M:-0}"
      AI_PRICE_CURRENCY: "${AI_PRICE_CURRENCY:-RUB}"
      AI_STT_ENABLED: "${AI_STT_ENABLED:-false}"
      REQUIRE_NEURAL_EVALUATION: "${REQUIRE_NEURAL_EVALUATION:-false}"
      ALLOW_CLIENT_TRANSCRIPT: "${ALLOW_CLIENT_TRANSCRIPT:-true}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      VK_CLIENT_ID: "${VK_CLIENT_ID:-${NEXT_PUBLIC_VK_CLIENT_ID:-54805089}}"
      VK_CLIENT_SECRET: "${VK_CLIENT_SECRET:-}"
      YANDEX_CLIENT_ID: "${YANDEX_CLIENT_ID:-${NEXT_PUBLIC_YANDEX_CLIENT_ID:-}}"
      YANDEX_CLIENT_SECRET: "${YANDEX_CLIENT_SECRET:-}"
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - det-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
        NEXT_PUBLIC_VK_CLIENT_ID: "${NEXT_PUBLIC_VK_CLIENT_ID:-}"
        NEXT_PUBLIC_YANDEX_CLIENT_ID: "${NEXT_PUBLIC_YANDEX_CLIENT_ID:-}"
      NEXT_PUBLIC_ARENA_ENABLED: "${NEXT_PUBLIC_ARENA_ENABLED:-false}"
        NEXT_PUBLIC_ARENA_ENABLED: "${NEXT_PUBLIC_ARENA_ENABLED:-false}"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:18080}"
        NEXT_PUBLIC_DIRECTUS_URL: "${NEXT_PUBLIC_DIRECTUS_URL:-http://localhost:18055}"
    container_name: det-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:18080}"
      NEXT_PUBLIC_DIRECTUS_URL: "${NEXT_PUBLIC_DIRECTUS_URL:-http://localhost:18055}"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
      NEXT_PUBLIC_VK_CLIENT_ID: "${NEXT_PUBLIC_VK_CLIENT_ID:-}"
      NEXT_PUBLIC_YANDEX_CLIENT_ID: "${NEXT_PUBLIC_YANDEX_CLIENT_ID:-}"
      PORT: "3000"
      NODE_ENV: "production"
      # Same-origin proxies: the browser talks to nginx/Next only, the
      # containers talk to each other over the internal docker network.
      API_PROXY_TARGET: "http://backend:8080"
      DIRECTUS_INTERNAL_URL: "http://directus:8055"
    depends_on:
      - backend
    networks:
      - det-network

  directus:
    image: directus/directus:11.1
    container_name: det-directus
    restart: unless-stopped
    ports:
      - "127.0.0.1:18055:8055"
    environment:
      KEY: "${DIRECTUS_KEY:?DIRECTUS_KEY is required}"
      SECRET: "${DIRECTUS_SECRET:?DIRECTUS_SECRET is required}"
      ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL:?DIRECTUS_ADMIN_EMAIL is required}"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD:?DIRECTUS_ADMIN_PASSWORD is required}"
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "${POSTGRES_DB:-det_academy}"
      DB_USER: "${POSTGRES_USER:-postgres}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      DB_SSL: "false"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "${DIRECTUS_CORS_ORIGIN:-https://det-academy.ru,https://www.det-academy.ru,http://localhost:3000,http://localhost:13000}"
      PUBLIC_URL: "${DIRECTUS_PUBLIC_URL:-/directus}"
      CONTENT_SECURITY_POLICY_DIRECTIVES__SCRIPT_SRC: "'self' 'unsafe-eval' 'unsafe-inline' blob:"
      CONTENT_SECURITY_POLICY_DIRECTIVES__CONNECT_SRC: "'self' http: https: ws: wss: *"
      STORAGE_LOCATIONS: "local"
      STORAGE_LOCAL_ROOT: "./uploads"
    volumes:
      - directus_uploads:/directus/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - det-network

volumes:
  postgres_data:
    driver: local
  directus_uploads:
    driver: local
  media_data:
    driver: local

networks:
  det-network:
    driver: bridge
