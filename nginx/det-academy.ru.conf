# ==============================================================================
# Nginx Configuration for det-academy.ru
# Production Reverse Proxy with Let's Encrypt SSL
# ==============================================================================

# 1. HTTP Server - Redirects all traffic to HTTPS + ACME Challenge for Certbot
server {
    listen 80;
    listen [::]:80;
    server_name det-academy.ru www.det-academy.ru;

    # Let's Encrypt / Certbot verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Main Secure Platform
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name det-academy.ru www.det-academy.ru;

    # Let's Encrypt SSL Certificates (created by certbot)
    ssl_certificate /etc/letsencrypt/live/det-academy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/det-academy.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/det-academy.ru/chain.pem;

    # Modern TLS Security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Max upload body size (50MB for test audio recording and image analysis)
    client_max_body_size 50M;

    # --- Backend Go API (port 18080) ---
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- Frontend Next.js Platform (port 13000) ---
    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR & live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
