name: Uptime

# Cheap external monitor: a scheduled check of the public endpoints. A failure
# sends the standard GitHub Actions notification to the repository owner, which
# is enough until a dedicated monitoring provider is configured.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Public endpoints
        run: |
          set -euo pipefail
          for url in \
            https://det-academy.ru/api/v1/health \
            https://det-academy.ru/api/v1/ready \
            https://det-academy.ru/ \
            https://det-academy.ru/registry/institutions-map
          do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "$url -> $status"
            if [ "$status" != "200" ]; then
              echo "::error::$url returned $status"
              exit 1
            fi
          done

      - name: Telegram alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping the alert"
            exit 0
          fi
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=DET Academy: проверка доступности не прошла. ${RUN_URL}"
