name: Deploy

# Production deploys happen only from an annotated tag, never from a branch
# push. The health gate at the end fails the run when the public service does
# not become ready, which makes a broken release visible immediately.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Require a release tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Production deploys must run from a tag, not ${{ github.ref_type }} ${{ github.ref_name }}"
          exit 1

      - name: Require a green CI run for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is required to verify CI"
            exit 1
          fi
          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=20")"
            conclusions="$(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.status == "completed") | .conclusion')"
            if printf '%s\n' "$conclusions" | grep -qx 'success'; then
              echo "CI is green for $SHA"
              exit 0
            fi
            if printf '%s\n' "$conclusions" | grep -Eq '^(failure|cancelled|timed_out|action_required|stale)$'; then
              echo "::error::CI for $SHA has a failed or cancelled run; refusing to deploy"
              exit 1
            fi
            if printf '%s' "$runs" | jq -e '.workflow_runs | length > 0' >/dev/null; then
              echo "CI is still running for $SHA; waiting..."
            else
              echo "No CI run exists yet for $SHA; waiting..."
            fi
            sleep 20
          done
          echo "::error::timed out waiting for a green CI run for $SHA"
          exit 1

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_HOST and DEPLOY_SSH_KEY secrets are required"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Production preflight
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER:-root}@${DEPLOY_HOST}" \
            "cd /root/det-academy && ./scripts/production_preflight.sh"

      - name: Deploy the tag
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ github.ref_name }}
          DEPLOY_SKIP_PULL: "true"
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER:-root}@${DEPLOY_HOST}" \
            "cd /root/det-academy && git fetch origin --tags --force '$TAG' && git checkout --force FETCH_HEAD && DEPLOY_SKIP_PULL=true ./scripts/deploy_production.sh --backup"

      - name: Health gate
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://det-academy.ru/api/v1/ready || echo 000)
            echo "attempt $attempt: /api/v1/ready -> $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::production did not become ready after the deploy"
          exit 1

      - name: Roll back the previous images
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER:-root}@${DEPLOY_HOST}" \
            "cd /root/det-academy && ./scripts/rollback_production.sh"
