name: Nightly database backup

# Runs on the production host over SSH: the database is not exposed to the
# internet, so the dump must be produced where Postgres lives. The latest dump
# is streamed to the runner, encrypted with BACKUP_ENCRYPTION_KEY and retained
# as an offsite GitHub Actions artifact for 14 days.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: production-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_HOST and DEPLOY_SSH_KEY secrets are required"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Dump database and media on the production host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER:-root}@${DEPLOY_HOST}" \
            'cd /root/det-academy && set -a && . ./.env && set +a && BACKUP_DIR=/var/backups/det ./scripts/backup_postgres.sh && \
             stamp=$(date -u +%Y%m%dT%H%M%SZ) && \
             docker run --rm -v det-academy_media_data:/data -v /var/backups/det:/backup alpine:3.20 \
               tar -czf "/backup/media-$stamp.tar.gz" -C /data . && \
             echo "media backup: /var/backups/det/media-$stamp.tar.gz"'

      - name: Fetch and encrypt the latest dump
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "::error::BACKUP_ENCRYPTION_KEY is required"
            exit 1
          fi
          LATEST="$(ssh -i ~/.ssh/deploy_key "${DEPLOY_USER:-root}@${DEPLOY_HOST}" \
            "ls -t /var/backups/det/det_academy_*.dump | head -1")"
          LATEST_MEDIA="$(ssh -i ~/.ssh/deploy_key "${DEPLOY_USER:-root}@${DEPLOY_HOST}" \
            "ls -t /var/backups/det/media-*.tar.gz | head -1")"
          scp -i ~/.ssh/deploy_key "${DEPLOY_USER:-root}@${DEPLOY_HOST}:$LATEST" ./backup.dump
          scp -i ~/.ssh/deploy_key "${DEPLOY_USER:-root}@${DEPLOY_HOST}:$LATEST_MEDIA" ./backup_media.tar.gz
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_ENCRYPTION_KEY \
            -in ./backup.dump -out ./det_academy_latest.dump.enc
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_ENCRYPTION_KEY \
            -in ./backup_media.tar.gz -out ./det_academy_latest.media.tar.gz.enc
          rm -f ./backup.dump ./backup_media.tar.gz
          sha256sum ./det_academy_latest.dump.enc ./det_academy_latest.media.tar.gz.enc > ./det_academy_latest.sha256

      - name: Upload encrypted offsite artifact
        uses: actions/upload-artifact@v4
        with:
          name: det-academy-backup-${{ github.run_id }}
          path: |
            det_academy_latest.dump.enc
            det_academy_latest.media.tar.gz.enc
            det_academy_latest.sha256
          retention-days: 14
          if-no-files-found: error
