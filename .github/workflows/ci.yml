name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: python3 scripts/lint_content.py
      - run: python3 scripts/lint_content.py backend/db/05-productive-question-bank.sql
      - run: python3 scripts/lint_content.py backend/db/06-level-bank.sql
      - run: python3 scripts/lint_content.py backend/db/07-theory-content.sql
      - run: python3 scripts/lint_content.py backend/db/08-productive-bank.sql
      - run: node scripts/generate_productive_bank.mjs --check
      - run: node scripts/check_question_images.mjs
      - run: node scripts/sync_question_bank.mjs --check
      - run: node scripts/generate_level_bank.mjs --check
      - run: python3 scripts/review_content.py
      - run: python3 scripts/test_calibration.py
      - run: python3 scripts/calibration_validate.py backend/tests/fixtures/calibration_expert_dataset.json --allow-fixture
      - run: node scripts/preflight_external.mjs || true
      - run: npm run build
      - run: npm run check:bundle

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: det_academy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d det_academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Apply schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d det_academy_test -f backend/db/init.sql
          for f in backend/db/migrations/*.sql; do PGPASSWORD=postgres psql -h localhost -U postgres -d det_academy_test -f "$f"; done
      - name: Validate bootstrap schema
        run: DATABASE_URL="postgres://postgres:postgres@localhost:5432/det_academy_test?sslmode=disable" bash scripts/validate_schema.sh
      - run: cd backend && go vet ./... && go test -race ./... -count=1
      - run: cd backend && TEST_DATABASE_URL="postgres://postgres:postgres@localhost:5432/det_academy_test?sslmode=disable" go test ./tests -run TestPostgresTrustedCompletionIntegrity -count=1
      - run: cd backend && go test -race ./tests -count=1

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14


  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production and modern nginx configs
        run: bash scripts/validate_nginx_config.sh

  fullstack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: det_academy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d det_academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Prepare database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d det_academy_test -f backend/db/init.sql
          for f in backend/db/migrations/*.sql; do psql -h localhost -U postgres -d det_academy_test -f "$f"; done
          psql -h localhost -U postgres -d det_academy_test -f backend/db/03-content-seed.sql
          psql -h localhost -U postgres -d det_academy_test -f backend/db/04-vocabulary-seed.sql
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run full-stack E2E
        env:
          FULLSTACK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/det_academy_test?sslmode=disable
        run: bash scripts/run_fullstack_e2e.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action scans the pushed commit range; a shallow checkout
          # makes the previous revision unavailable and fails the scan.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Production dependency audit (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Go vulnerability check (blocking)
        run: cd backend && go vet ./... && go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
