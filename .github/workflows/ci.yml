name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: det_academy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d det_academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: Apply schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d det_academy_test -f backend/db/init.sql
          for f in backend/db/migrations/*.sql; do PGPASSWORD=postgres psql -h localhost -U postgres -d det_academy_test -f "$f"; done
      - run: cd backend && go vet ./... && go test -race ./... -count=1
      - run: cd backend && TEST_DATABASE_URL="postgres://postgres:postgres@localhost:5432/det_academy_test?sslmode=disable" go test ./tests -run TestPostgresTrustedCompletionIntegrity -count=1
      - run: cd backend && go test -race ./tests -count=1

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high || true
      - run: cd backend && go vet ./... && go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./... || true
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
